<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Carteras | Distribuidora Lyra</title>
    <link rel="shortcut icon" href="../lyr4.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Aclonica&family=Instrument+Sans:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../catalogo.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="logo-area" href="../index.html">
          <img
            class="logo-img"
            src="../lyr2.png"
            alt="Lyra"
            onerror="this.style.display = 'none'"
          />
          <span class="logo-text">LYRA</span>
          <span class="header-subtitle">Catálogo de Carteras y Accesorios</span>
        </a>
        <div class="header-right">
          <a class="back-link" href="../index.html">← Volver</a>
          <a class="wa-btn" href="https://wa.me/543512309375" target="_blank"
            >WhatsApp</a
          >
        </div>
      </div>
    </header>

    <!-- FILTERS -->
    <div class="filters-bar">
      <h2>Nuestros modelos</h2>
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">Todos</button>
        <button class="filter-pill" data-filter="carteras">Carteras</button>
        <button class="filter-pill" data-filter="mochilas">Mochilas</button>
        <button class="filter-pill" data-filter="bandoleras">Bandoleras</button>
        <button class="filter-pill" data-filter="accesorios">Accesorios</button>
        <button class="filter-pill" data-filter="hombre">Línea Hombre</button>
      </div>
    </div>

    <!-- CATALOG (se genera solo desde el array PRODUCTOS de abajo) -->
    <main class="catalog-grid" id="catalog"></main>

    <!-- FOOTER -->
    <footer class="site-footer" id="contacto">
      <div class="footer-brand">Distribuidora Lyra</div>
      <p>· Consultas por WhatsApp</p>
      <p style="margin-top: 0.5rem">
        © 2025 Distribuidora Lyra · Córdoba, Argentina
      </p>
    </footer>

    <!-- CART WIDGET (external script for unified cart) -->
    <div id="lyra-cart-fab"></div>
    <script src="../lyra-cart-widget.js"></script>

    <script>
      // ==========================================================
      //  PRODUCTOS DE CARTERAS — ÚNICA FUENTE DE PRECIOS
      //  Para cambiar un precio: editá "precio" (un solo lugar).
      //  El número que se muestra y el que va al carrito salen
      //  del MISMO valor, así que nunca se pueden desincronizar.
      //  Categorías válidas: carteras | mochilas | bandoleras |
      //                      accesorios | hombre
      // ==========================================================
      const PRODUCTOS = [
        // ── CARTERAS ──
        { cat: "carteras", nombre: "Anto Hebilla", desc: "Cartera hobo elegante con hebilla metálica decorativa.", img: "antohebilla1.png", colores: ["Negro"], precio: 18500 },
        { cat: "carteras", nombre: "Pilar", desc: "Cartera compacta con solapa, boca con cierre y correa desmontable con mosquetón.", img: "pilar1.png", colores: ["Negro", "Tierra"], precio: 18500 },
        { cat: "carteras", nombre: "Abril", desc: "Bolso tote amplio con tachas decorativas. Ideal para el día a día.", img: "abril1.png", colores: ["Negro"], precio: 19700 },
        { cat: "carteras", nombre: "Bolso Totebag", desc: "Tote bag forrado en su interior. Ideal para la facu.", img: "totebag1.png", colores: ["Camel maíz"], precio: 16300 },
        { cat: "carteras", nombre: "Clara", desc: "Cartera compacta con asa superior y correa bandolera con tachas.", img: "clara1.jpg", colores: ["Negro"], precio: 18600 },
        { cat: "carteras", nombre: "Paz", desc: 'Bandolera con correa estampada "LOVE" y cierre doble.', img: "paz1.png", colores: ["Negro", "Nude"], precio: 18500 },

        // ── MOCHILAS ──
        { cat: "mochilas", nombre: "Mochila Lola", desc: "Mochila elegante con solapa y cierre giratorio metálico.", img: "lola1.png", colores: ["Negro"], precio: 22700 },
        { cat: "mochilas", nombre: "Mochila Matera Puff", desc: "Mochila acolchada ideal para el mate. Estilo puffer.", img: "mochimatera.jpg", colores: ["Negro brillante", "Negro opaco"], precio: 14800 },

        // ── BANDOLERAS Y BOLSOS ──
        { cat: "bandoleras", nombre: "Lucía", desc: "Mini bolso portacelular con correa camuflada.", img: "lucia1.png", colores: ["Negro"], precio: 16100 },
        { cat: "bandoleras", nombre: "Pechera Dama", desc: "Pechera cruzada con múltiples compartimentos.", img: "pechera.jpg", colores: ["Negro"], precio: 17100 },
        { cat: "bandoleras", nombre: "Bandolera Romi Puff", desc: "Bandolera acolchada puffer con asa y correa.", img: "bandoleraromipuff.jpg", colores: ["Negro"], precio: 11600 },
        { cat: "bandoleras", nombre: "Bandolera Luz", desc: "Bandolera con correa ancha estampada de estrellas.", img: "bandoleraluz.jpg", colores: ["Negro", "Azul marino"], precio: 12900 },
        { cat: "bandoleras", nombre: "Bolsito Bolichero", desc: "Mini bolso bucket con cadena. Ideal para salidas nocturnas.", img: "bolsitobolichero.jpg", colores: ["Croco plata"], precio: 14900 },

        // ── ACCESORIOS ──
        { cat: "accesorios", nombre: "Luna (Portacelular)", desc: "Carterita portacelular con correa bandolera.", img: "lunas.jpg", colores: ["Negro trenzado", "Plata", "Nude", "Camel"], precio: 12600 },
        { cat: "accesorios", nombre: "Sobres", desc: "Sobre de mano elegante para eventos y salidas.", img: "sobres.jpg", colores: ["Oro suave", "Plata suave"], precio: 8800 },
        { cat: "accesorios", nombre: "Billeteras", desc: "Billeteras con diseños variados y cierre metálico.", img: "billeteras.jpg", colores: ["Cuadros rosa", "Plata quebrada", "Estrellitas tornasol"], precio: 5900 },
        { cat: "accesorios", nombre: "Set Yerbera + Azucarera", desc: "Set impermeable de yerbera y azucarera. Ideal para el mate.", img: "setchaulataplateado.jpg", colores: ["Plateado", "Rosa"], precio: 9900 },
        { cat: "accesorios", nombre: "Lunchera", desc: "Lunchera infantil con diseños divertidos.", img: "lunchera.jpg", colores: ["Hello Kitty", "Barbie"], precio: 7500, badge: "Infantil" },
        // Cartucheras: dos tamaños con precio distinto (variantesPrecio)
        { cat: "accesorios", nombre: "Cartucheras de Neoprene", desc: "Cartucheras sublimadas con diseños variados. Solicitá catálogo de diseños.", img: "cartucheras.jpg", variantesPrecio: [{ label: "Medianas", precio: 4800 }, { label: "Grandes", precio: 7500 }] },

        // ── LÍNEA HOMBRE ──
        { cat: "hombre", nombre: "Pechera", nombreCarrito: "Pechera Hombre", desc: "Pechera cruzada en simil cuero para hombre.", img: "pecherahombre.jpg", colores: ["Negro"], precio: 17100 },
        { cat: "hombre", nombre: "Tabaquera", desc: "Tabaquera marca Septiembre con compartimentos internos y cierre.", img: "tabaquera1.jpg", colores: ["Negro", "Madera nobuk"], precio: 10300 },
        { cat: "hombre", nombre: "Yerbera Nobuk", desc: "Yerbero con portabombilla. Marca Septiembre.", img: "yerberasnobuk.jpg", colores: ["Gris", "Avellana"], precio: 7300 },
        { cat: "hombre", nombre: "Tarjeteros", desc: "Tarjetero compacto marca Septiembre con detalle tejido.", img: "tarjeteros.jpg", colores: ["Marrón"], precio: 5200 },
        { cat: "hombre", nombre: "Riñonera Adulto", desc: "Riñonera deportiva. Disponible lisa y con escudos de clubes.", img: "riñonera1.jpg", colores: ["Negra lisa", "Talleres", "Belgrano", "Boca", "River"], precio: 8600 },
        { cat: "hombre", nombre: "Bolso Deportivo", desc: "Bolso tamaño botinera con escudos de clubes y AFA.", img: "bolsodeportivo.jpg", colores: ["AFA", "Talleres", "Belgrano", "Boca", "River"], precio: 11800 },
        { cat: "hombre", nombre: "Bandolera Unisex", desc: "Bandolera compacta unisex.", img: "bandoleraunisex.jpg", colores: ["Gris tierra", "Stitch"], precio: 7900 },
      ];

      // Orden y títulos de las secciones
      const SECCIONES = [
        { id: "carteras", titulo: "Carteras" },
        { id: "mochilas", titulo: "Mochilas" },
        { id: "bandoleras", titulo: "Bandoleras y Bolsos" },
        { id: "accesorios", titulo: "Accesorios" },
        { id: "hombre", titulo: "Línea Hombre" },
      ];

      const CART_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/></svg>';
      const CHECK_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';

      function fmt(n) {
        return "$" + Number(n).toLocaleString("es-AR");
      }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // === RENDER: arma las tarjetas desde PRODUCTOS ===
      function render() {
        const catalog = document.getElementById("catalog");
        let html = "";

        SECCIONES.forEach((sec) => {
          const items = PRODUCTOS.filter((p) => p.cat === sec.id);
          if (!items.length) return;

          html +=
            '<div class="section-header" data-section="' + sec.id + '">' +
            "<h3>" + esc(sec.titulo) + "</h3>" +
            '<span class="count">' + items.length + " producto" + (items.length === 1 ? "" : "s") + "</span>" +
            "</div>";

          items.forEach((p, i) => {
            const delay = (0.05 + i * 0.05).toFixed(2);
            const badge = p.badge ? '<span class="card-badge">' + esc(p.badge) + "</span>" : "";

            // Precio base + selector (según tipo de producto)
            let precioInicial, selectHtml = "", nombreCarrito, colores;

            if (p.variantesPrecio) {
              // Producto con precio por variante (ej. cartucheras)
              precioInicial = p.variantesPrecio[0].precio;
              colores = p.variantesPrecio.map((v) => v.label);
              nombreCarrito = p.nombre + " - " + p.variantesPrecio[0].label;
              selectHtml =
                '<select class="variant-select" onchange="updateVariantPrice(this)">' +
                p.variantesPrecio
                  .map((v) => '<option value="' + esc(v.label) + '" data-price="' + v.precio + '">' + esc(v.label) + " - " + fmt(v.precio) + "</option>")
                  .join("") +
                "</select>";
            } else {
              precioInicial = p.precio;
              colores = p.colores || [];
              const base = p.nombreCarrito || p.nombre;
              nombreCarrito = colores.length > 1 ? base + " - " + colores[0] : base;
              if (colores.length > 1) {
                selectHtml =
                  '<select class="variant-select" onchange="updateVariant(this)">' +
                  colores.map((c) => '<option value="' + esc(c) + '">' + esc(c) + "</option>").join("") +
                  "</select>";
              }
            }

            const chips = (colores || []).map((c) => '<span class="color-tag">' + esc(c) + "</span>").join("");

            html +=
              '<article class="product-card" data-category="' + p.cat + '" style="animation-delay: ' + delay + 's">' +
                '<div class="card-image">' +
                  '<img src="./carteras-img/' + esc(p.img) + '" alt="' + esc(p.nombre) + '" loading="lazy" />' +
                  badge +
                "</div>" +
                '<div class="card-body">' +
                  '<h4 class="card-name">' + esc(p.nombre) + "</h4>" +
                  '<p class="card-desc">' + esc(p.desc) + "</p>" +
                  '<div class="card-colors">' + chips + "</div>" +
                  selectHtml +
                  '<div class="card-footer">' +
                    '<div class="card-price">' + fmt(precioInicial) + "<small>precio por mayor</small></div>" +
                    '<button class="btn-add" data-name="' + esc(nombreCarrito) + '" data-price="' + precioInicial + '" onclick="addToCart(this)">' +
                      CART_SVG + " Agregar" +
                    "</button>" +
                  "</div>" +
                "</div>" +
              "</article>";
          });
        });

        catalog.innerHTML = html;
      }

      // === FILTROS ===
      function initFilters() {
        document.querySelectorAll(".filter-pill").forEach((pill) => {
          pill.addEventListener("click", () => {
            document.querySelectorAll(".filter-pill").forEach((p) => p.classList.remove("active"));
            pill.classList.add("active");
            const filter = pill.dataset.filter;
            document.querySelectorAll(".product-card").forEach((card) => {
              card.dataset.hidden = filter !== "all" && card.dataset.category !== filter ? "true" : "false";
            });
            document.querySelectorAll(".section-header").forEach((header) => {
              const section = header.dataset.section;
              header.style.display = filter !== "all" && section !== filter ? "none" : "";
            });
          });
        });
      }

      // === SELECTOR DE COLOR (mismo precio) ===
      function updateVariant(select) {
        const card = select.closest(".product-card");
        const btn = card.querySelector(".btn-add");
        const baseName = card.querySelector(".card-name").textContent;
        btn.dataset.name = baseName + " - " + select.value;
        btn.classList.remove("added");
        btn.innerHTML = CART_SVG + " Agregar";
      }

      // === SELECTOR DE VARIANTE CON PRECIO (ej. cartucheras) ===
      function updateVariantPrice(select) {
        const opt = select.options[select.selectedIndex];
        const price = opt.dataset.price;
        const card = select.closest(".product-card");
        const priceEl = card.querySelector(".card-price");
        const btn = card.querySelector(".btn-add");
        const baseName = card.querySelector(".card-name").textContent;
        priceEl.innerHTML = fmt(price) + "<small>precio por mayor</small>";
        btn.dataset.price = price;
        btn.dataset.name = baseName + " - " + select.value;
        btn.classList.remove("added");
        btn.innerHTML = CART_SVG + " Agregar";
      }

      // === AGREGAR AL CARRITO — usa window.lyraCart.add(nombre, precio, cantidad) ===
      function addToCart(btn) {
        const nombre = btn.dataset.name;
        const precio = parseInt(btn.dataset.price);

        if (window.lyraCart && typeof window.lyraCart.add === "function") {
          window.lyraCart.add(nombre, precio, 1);
        } else {
          let cart = JSON.parse(localStorage.getItem("lyra_products") || "[]");
          const existing = cart.findIndex((i) => i.nombre === nombre);
          if (existing >= 0) {
            cart[existing].cantidad++;
          } else {
            cart.push({ nombre: nombre, precio: precio, cantidad: 1 });
          }
          localStorage.setItem("lyra_products", JSON.stringify(cart));
        }

        btn.classList.add("added");
        btn.innerHTML = CHECK_SVG + " Agregado";
        setTimeout(() => {
          btn.classList.remove("added");
          btn.innerHTML = CART_SVG + " Agregar";
        }, 1500);
      }

      // === INIT ===
      render();
      initFilters();
    </script>
  </body>
</html>
