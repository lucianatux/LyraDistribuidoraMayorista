<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tinturas y Tratamientos | Distribuidora Lyra</title>
    <link rel="shortcut icon" href="../lyr4.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Aclonica&family=Instrument+Sans:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../catalogo.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a class="logo-area" href="../index.html">
          <img
            class="logo-img"
            src="../lyr2.png"
            alt="Lyra"
            onerror="this.style.display = 'none'"
          />
          <span class="logo-text">LYRA</span>
          <span class="header-subtitle">Tinturas y Tratamientos</span>
        </a>
        <div class="header-right">
          <a class="back-link" href="../index.html">← Volver</a>
          <a class="wa-btn" href="https://wa.me/543512309375" target="_blank"
            >WhatsApp</a
          >
        </div>
      </div>
    </header>
    <!-- INDEX.HTML DENTRO DE LA CARPETA TINTURAS -->
    <!-- FILTERS -->
    <div class="filters-bar">
      <h2>Tinturas y Tratamientos</h2>
      <div class="filter-pills">
        <button class="filter-pill active" data-filter="all">Todos</button>
        <button class="filter-pill" data-filter="tinturas">
          Tinturas y Tratamientos
        </button>
      </div>
    </div>

    <!-- CARTA DE COLORES (PDF embebido) -->
    <section class="pdf-block">
      <h3 class="pdf-title">Carta de colores EstereoColor</h3>
      <p class="pdf-desc">
        Laboratorio Plumari
      </p>
      <div class="pdf-viewer">
        <iframe src="carta.pdf#view=FitH" loading="lazy" title="Carta de colores"></iframe>
      </div>
      <a class="pdf-preview-mobile" href="carta.pdf" target="_blank" rel="noopener noreferrer">
        <img src="carta.jpg" alt="Carta de colores" />
        <span class="pdf-preview-hint">Tocá para ver el PDF completo →</span>
      </a>
      <div class="pdf-actions">
        <a href="carta.pdf" download>
          <button class="pdf-btn">⬇ Descargar carta</button>
        </a>
        <a href="carta.pdf" target="_blank" rel="noopener noreferrer">
          <button class="pdf-btn">↗ Abrir en pestaña nueva</button>
        </a>
      </div>
    </section>

    <!-- CATALOG (se genera solo desde el array PRODUCTOS de abajo) -->
    <main class="catalog-grid" id="catalog"></main>

    <!-- FOOTER -->
    <footer class="site-footer" id="contacto">
      <div class="footer-brand">Distribuidora Lyra</div>
      <p>· Consultas por WhatsApp</p>
      <p style="margin-top: 0.5rem">
        © 2026 Distribuidora Lyra · Córdoba, Argentina
      </p>
    </footer>

    <!-- CART WIDGET (external script for unified cart) -->
    <div id="lyra-cart-fab"></div>
    <script src="../lyra-cart-widget.js"></script>

    <!-- Motor compartido: lee carteras.json y dibuja las tarjetas -->
    <script src="../catalogo.js"></script>
    <script>
      Catalogo.init({ json: "tinturas.json" });
    </script>
  </body>
</html>
